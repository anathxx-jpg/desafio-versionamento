
name: Validar projeto

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  validar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Verificar arquivos do projeto
        run: |
          test -f index.html
          test -f style.css
          test -f README.md
          echo "Todos os arquivos foram encontrados!"